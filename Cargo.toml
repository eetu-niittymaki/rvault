[package]
name = "rvault"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
anyhow = "1.0.95"
clap = { version = "4.6.0", features = ["derive"] }
crypto = "0.5.1"
orion = "0.17.13"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7.4.0"
libsqlite3-sys = { version = "0.30.1", features = [
    "bundled-sqlcipher"
] }
base64 = "0.22.1"
dotenv = "0.15"
rand = "0.10.0"
cli-clipboard = "0.4.0"


[dependencies.sqlx]
version = "0.8.3"
default-features = false
features = [
    "runtime-tokio-rustls",
    "macros",
    "sqlite",
    "migrate"
]

[build-dependencies]
dotenv = "0.15" 

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0